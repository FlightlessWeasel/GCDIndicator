Return the verified answer in Lua 5.1 syntax when code is useful. Cite the MCP result, external page, or exact repository path supporting each material claim, and flag any remaining uncertainty. If a proposed change alters indicator size, spacing, colors, or calibration markers, tell the parent agent to check the companion project's mapping table and flag the pixel-protocol change to the user.
